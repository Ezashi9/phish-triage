name: Evaluate on real emails

# Runs on GitHub's machines so live phishing samples never touch a personal computer.
# Only aggregate results (RESULTS-seed*.md, results-seed*.json) are committed; the emails are not.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Random seed for the phishing sample (2026 = tuning sample, 7 = held-out sample)"
        default: "2026"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Download datasets
        env:
          SAMPLE_SEED: ${{ inputs.seed }}
        run: python -m evaluation.fetch_datasets
      - name: Evaluate
        run: python -m evaluation.evaluate
      - name: Describe missed phishing (aggregate counts, log only)
        run: python -m evaluation.analyse_misses
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/RESULTS-seed*.md evaluation/results-seed*.json
          if git diff --cached --quiet; then
            echo "Results unchanged."
          else
            git commit -m "Update evaluation results (seed ${{ inputs.seed }})"
            git push
          fi
