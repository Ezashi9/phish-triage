name: Evaluate on real emails

# Runs on GitHub's machines so live phishing samples never touch a personal computer.
# Only aggregate results (RESULTS.md, results.json) are committed; the emails are not.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Download datasets
        run: python -m evaluation.fetch_datasets
      - name: Evaluate
        run: python -m evaluation.evaluate
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/RESULTS.md evaluation/results.json
          if git diff --cached --quiet; then
            echo "Results unchanged."
          else
            git commit -m "Update evaluation results"
            git push
          fi
